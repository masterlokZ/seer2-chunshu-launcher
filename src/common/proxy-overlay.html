<!DOCTYPE html><html><head><meta charset="UTF-8"><title>代理设置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0a0e1a;--bdr:rgba(0,212,255,.12);--txt:#e2e8f0;--dim:#64748b;--pri:#00d4ff;--sc:#22c55e;--red:#ef4444;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:11px;display:flex;flex-direction:column;overflow:hidden;}
.titlebar{height:30px;background:rgba(0,212,255,.06);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px;padding:0 10px;-webkit-app-region:drag;flex-shrink:0;}
.titlebar-txt{font-size:11px;font-weight:600;color:var(--pri);letter-spacing:1px;flex:1;}
.titlebar-min{-webkit-app-region:no-drag;width:20px;height:20px;border:none;border-radius:3px;background:rgba(100,116,139,.10);color:var(--dim);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.6;transition:all .18s;}.titlebar-min:hover{background:rgba(100,116,139,.25);opacity:1;color:var(--txt);}.titlebar-close{-webkit-app-region:no-drag;width:20px;height:20px;border:none;border-radius:3px;background:rgba(239,68,68,.08);color:var(--red);font-size:12px;cursor:pointer;}
.titlebar-close:hover{background:rgba(239,68,68,.22);}
.status-bar{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;background:rgba(0,0,0,.2);}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:all .3s;}
.dot.off{background:rgba(100,116,139,.4);}
.dot.on{background:var(--sc);box-shadow:0 0 8px var(--sc);}
.st-lbl{flex:1;font-size:11px;font-weight:600;color:var(--dim);}
.st-lbl.on{color:var(--sc);}
.tgl-wrap{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag;}
.tgl-lbl{font-size:10px;color:var(--dim);}
.tgl{position:relative;width:44px;height:22px;cursor:pointer;}
.tgl input{opacity:0;width:0;height:0;}
.tgl-track{position:absolute;inset:0;background:rgba(100,116,139,.3);border-radius:11px;transition:.22s;}
.tgl-track:before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.22s;}
input:checked+.tgl-track{background:var(--sc);}
input:checked+.tgl-track:before{transform:translateX(22px);}
.body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0;}
.card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:visible;}
.card-hdr{padding:8px 13px;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--dim);text-transform:uppercase;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(255,255,255,.05);border-radius:10px 10px 0 0;}
.card-body{padding:12px 13px;display:flex;flex-direction:column;gap:9px;border-radius:0 0 10px 10px;min-height:52px;}
.field{display:flex;align-items:center;gap:10px;}
.field-lbl{width:72px;font-size:10px;color:var(--dim);flex-shrink:0;text-align:right;}
.field-inp{flex:1;height:28px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:var(--txt);font-size:11px;font-family:'Consolas',monospace;padding:0 9px;}
.field-inp:focus{outline:none;border-color:var(--pri);}
.field-inp.port{width:80px;flex:none;}
.type-btns{display:flex;gap:5px;}
.type-btn{flex:1;height:28px;border:none;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;}
.type-btn.off{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--dim);}
.type-btn.on{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);color:var(--pri);}
.note{font-size:9.5px;color:var(--dim);line-height:1.7;padding:8px 10px;background:rgba(0,212,255,.03);border:1px solid rgba(0,212,255,.08);border-radius:7px;}
.note b{color:var(--pri);}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;background:rgba(0,0,0,.15);}
.btn{flex:1;height:32px;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;}
.btn.save{background:linear-gradient(135deg,rgba(0,180,220,.8),rgba(0,212,255,.9));color:#000;}
.btn.save:hover{filter:brightness(1.1);}
.btn.reset{flex:none;padding:0 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red);}
.sbar{height:22px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,14,26,.85);border-top:1px solid var(--bdr);font-size:9px;color:var(--dim);flex-shrink:0;}
.toast{position:fixed;bottom:30px;right:12px;padding:6px 12px;background:rgba(13,20,38,.97);border:1px solid var(--bdr);border-radius:6px;font-size:10px;color:var(--txt);transform:translateY(30px);opacity:0;transition:all .22s;pointer-events:none;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-color:rgba(34,197,94,.4);}
.toast.bad{border-color:rgba(239,68,68,.4);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:rgba(0,212,255,.18);border-radius:2px;}

button:focus{outline:none;}
.titlebar-pin{
  -webkit-app-region:no-drag;
  width:20px;
  height:20px;
  border:none;
  border-radius:3px;
  background:transparent;
  color:var(--muted, #7e93a8);
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.5;
  transition:all .18s;
  outline:none;
  margin-left:auto;
}
.titlebar-pin:hover{background:rgba(255,255,255,.1);opacity:.85;}
.titlebar-pin.pinned{color:#f59e0b;opacity:1;outline:none;}
.titlebar-pin:focus{outline:none;}
</style>
</head><body>
<div class="titlebar">
  <span style="font-size:13px;">🌐</span>
  <span class="titlebar-txt">代 理 设 置</span>
  <button class="titlebar-pin" id="btnPin" onclick="togglePin()" title="固定窗口（固定后：不被点击游戏关闭，且打开其它窗口时也不会自动关闭，可多窗口共存）">📌</button>
  <button class="titlebar-min" onclick="if(window.electronAPI)window.electronAPI.minimizeSelf()" title="最小化到任务栏">─</button>
  <button class="titlebar-close" onclick="window.close()">✕</button>
</div>
<div class="status-bar">
  <div class="dot off" id="stDot"></div>
  <span class="st-lbl" id="stLabel">代理未启用 · 直连游戏</span>
  <div class="tgl-wrap">
    <span class="tgl-lbl">启用代理</span>
    <label class="tgl">
      <input type="checkbox" id="chkEnable" onchange="onToggle(this.checked)">
      <div class="tgl-track"></div>
    </label>
  </div>
</div>
<div class="body">
  <div class="card">
    <div class="card-hdr">代理类型</div>
    <div class="card-body">
      <div class="field">
        <span class="field-lbl">类型</span>
        <div class="type-btns">
          <button class="type-btn on" id="btnSocks5" onclick="setType('socks5')">SOCKS5</button>
          <button class="type-btn off" id="btnHttp"   onclick="setType('http')">HTTP</button>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hdr">服务器</div>
    <div class="card-body">
      <div class="field">
        <span class="field-lbl">主机</span>
        <input class="field-inp" id="inHost" type="text" placeholder="127.0.0.1" spellcheck="false">
      </div>
      <div class="field">
        <span class="field-lbl">端口</span>
        <input class="field-inp port" id="inPort" type="number" min="1" max="65535" placeholder="10808">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hdr">认证（可选）</div>
    <div class="card-body">
      <div class="field">
        <span class="field-lbl">用户名</span>
        <input class="field-inp" id="inUser" type="text" placeholder="留空则不认证" spellcheck="false">
      </div>
      <div class="field">
        <span class="field-lbl">密码</span>
        <input class="field-inp" id="inPass" type="password" placeholder="留空则不认证">
      </div>
    </div>
  </div>
  <div class="note">
    <b>注意：</b>代理默认关闭，游戏可直接启动。<br>
    启用后设置立即生效（无需重启游戏）。
  </div>
</div>
<div class="actions">
  <button class="btn reset" onclick="resetToDefault()">恢复默认</button>
  <button class="btn save" onclick="saveConfig()">💾 保存并应用</button>
</div>
<div class="sbar">
  <span>代理设置</span>
  <span id="sbarR" style="font-family:'Consolas',monospace;"></span>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var api = window.electronAPI;
var _cfg = { enabled: false, type: 'socks5', host: '127.0.0.1', port: 10808, username: '', password: '' };
var _toastT = null;

function toast(msg, cls) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (cls ? ' ' + cls : '');
  if (_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(function() { el.className = 'toast'; }, 2800);
}

function setType(t) {
  _cfg.type = t;
  document.getElementById('btnSocks5').className = 'type-btn ' + (t === 'socks5' ? 'on' : 'off');
  document.getElementById('btnHttp').className   = 'type-btn ' + (t === 'http'   ? 'on' : 'off');
}

function onToggle(checked) { _cfg.enabled = checked; updateStatus(); }

function updateStatus() {
  var dot   = document.getElementById('stDot');
  var label = document.getElementById('stLabel');
  var en    = document.getElementById('chkEnable').checked;
  if (en) {
    var host = document.getElementById('inHost').value.trim() || _cfg.host;
    var port = document.getElementById('inPort').value.trim() || _cfg.port;
    dot.className = 'dot on';
    label.className = 'st-lbl on';
    label.textContent = '代理已启用 · ' + _cfg.type.toUpperCase() + ' ' + host + ':' + port;
    document.getElementById('sbarR').textContent = _cfg.type + '://' + host + ':' + port;
  } else {
    dot.className = 'dot off';
    label.className = 'st-lbl';
    label.textContent = '代理未启用 · 直连游戏';
    document.getElementById('sbarR').textContent = '直连';
  }
}

function applyToForm(c) {
  _cfg = Object.assign(_cfg, c);
  document.getElementById('chkEnable').checked = !!c.enabled;
  document.getElementById('inHost').value = c.host || '127.0.0.1';
  document.getElementById('inPort').value = c.port || 10808;
  document.getElementById('inUser').value = c.username || '';
  document.getElementById('inPass').value = c.password || '';
  setType(c.type || 'socks5');
  updateStatus();
}

async function saveConfig() {
  var host = document.getElementById('inHost').value.trim();
  var port = parseInt(document.getElementById('inPort').value.trim(), 10);
  var user = document.getElementById('inUser').value.trim();
  var pass = document.getElementById('inPass').value;
  var en   = document.getElementById('chkEnable').checked;
  if (!host) { toast('请输入主机地址', 'bad'); return; }
  if (isNaN(port) || port < 1 || port > 65535) { toast('端口无效 (1-65535)', 'bad'); return; }
  var cfg = { enabled: en, type: _cfg.type, host: host, port: port, username: user, password: pass };
  try {
    var r = await api.setProxyConfig(cfg);
    if (r && r.ok) { _cfg = cfg; updateStatus(); toast(en ? '代理已开启并应用' : '已切换为直连', 'ok'); }
    else toast('保存失败', 'bad');
  } catch(e) { toast('错误: ' + e.message, 'bad'); }
}

async function resetToDefault() {
  applyToForm({ enabled: false, type: 'socks5', host: '127.0.0.1', port: 10808, username: '', password: '' });
  await saveConfig();
}

// Proxy mode change event
api.onProxyChanged(function(d) {
  updateStatus();
});

// Listen to input changes for live status update
['inHost','inPort'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', updateStatus);
});

// Load current config
api.getProxyConfig().then(function(r) {
  if (r && r.config) applyToForm(r.config);
}).catch(function(){});

// Pin
var _pinned = false;
function togglePin() {
  _pinned = !_pinned;
  var btn = document.getElementById('btnPin');
  if (btn) {
    btn.className = 'titlebar-pin' + (_pinned ? ' pinned' : '');
    btn.title = _pinned ? '已固定（多窗口共存中，不被点击或切换关闭）' : '固定窗口（固定后：不被点击游戏关闭，且打开其它窗口时也不会自动关闭，可多窗口共存）';
    try { btn.blur(); } catch(_) {}
  }
  try { window.electronAPI.setOverlayPinned(_pinned); } catch(e) {}
}
document.addEventListener('mouseup', function(event) {
  var button = event.target && event.target.closest ? event.target.closest('button') : null;
  if (button) setTimeout(function() { try { button.blur() } catch(_) {} }, 0);
});
</script>
</body></html>
